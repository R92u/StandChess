plugins { id 'com.android.application' }

def bundleGame = tasks.register('bundleGame', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'style.css', '*.js', 'assets/**', 'vendor/**', 'CREDITS.txt'
        exclude 'server.js'
    }
    into layout.buildDirectory.dir('generated/game')
}

android {
    namespace 'io.github.r92u.standchess'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.r92u.standchess'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.5.1'
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/game'))
    if (System.getenv('STANDCHESS_KEYSTORE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('STANDCHESS_KEYSTORE'))
                storePassword System.getenv('STANDCHESS_KEY_PASSWORD')
                keyAlias 'standchess'
                keyPassword System.getenv('STANDCHESS_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}
tasks.named('preBuild') { dependsOn bundleGame }
